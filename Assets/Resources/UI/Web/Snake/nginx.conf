server {
    listen       1002;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # gzip for text assets
    gzip              on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_types        text/plain text/css text/html application/javascript application/json image/svg+xml;

    # security headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    # the game is served at "/" and nowhere else — no asset paths, no deep links
    location = / {
        try_files /index.html =404;
    }

    # HTML: always revalidate so a new build goes live immediately
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        return 404;
    }
}
