# ─────────────────────────── HTTP :80 ───────────────────────────
# catch-all: any host other than the ones listed below gets nothing
server {
    listen       80 default_server;
    server_name  _;
    return       404;
}

# our domain over plain HTTP: redirect everything to HTTPS
server {
    listen       80;
    server_name  johnny4games.com www.johnny4games.com;
    return       301 https://johnny4games.com$request_uri;
}

# ─────────────────────────── HTTPS :443 ───────────────────────────
# unknown SNI: reject the handshake instead of serving anything
server {
    listen       443 ssl default_server;
    server_name  _;
    ssl_reject_handshake on;
}

server {
    listen       443 ssl;
    http2        on;
    server_name  johnny4games.com www.johnny4games.com;

    ssl_certificate      /etc/nginx/certs/johnny4games.com_bundle.pem;
    ssl_certificate_key  /etc/nginx/certs/johnny4games.com.key;
    ssl_protocols        TLSv1.2 TLSv1.3;
    ssl_ciphers          HIGH:!aNULL:!MD5;
    ssl_session_cache    shared:SSL:10m;
    ssl_session_timeout  1h;

    # /kitchen (no slash) -> /kitchen/
    location = /kitchen {
        return 301 /kitchen/;
    }

    # menu site: strip the /kitchen prefix and forward to the web container
    location /kitchen/ {
        proxy_pass http://web:1001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # snake game — /snake/ is the ONLY entry point for Snake.html.
    # /snake (no trailing slash) gets a 301 so the path is always /snake/.
    location = /snake {
        return 301 /snake/;
    }

    # strip the /snake prefix and forward to the snake container on 1002;
    # the container itself only answers "/" and 404s everything else
    location /snake/ {
        proxy_pass http://snake:1002/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # everything else on this domain: not found
    location / {
        return 404;
    }
}
